# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - DSP

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: acrrestaurante2026.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_AF273D53FB3C48CDAA4EBF07FEAC1C75 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_8820AE545A044B329D2D804046A27110 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: acrrestaurante2026.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_AF273D53FB3C48CDAA4EBF07FEAC1C75 }}/restaurante-app:${{ github.sha }}
          file: ./docker/Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9BAC894A86394743BEE365D81FA2E40A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2989520B78AD466EA21F4A4A1830F044 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D64CA910F4734D118FFCD3ACF4471FA5 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'DSP'
          slot-name: 'Production'
          images: 'acrrestaurante2026.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_AF273D53FB3C48CDAA4EBF07FEAC1C75 }}/restaurante-app:${{ github.sha }}'
          